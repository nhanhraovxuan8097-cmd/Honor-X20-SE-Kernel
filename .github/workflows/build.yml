name: Build Honor X20 SE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies and Toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          git curl bc bison build-essential flex libssl-dev libelf-dev \
          zip unzip python3 cpio wget \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Integrate SukiSU
      run: |
        cd Code_Opensource/kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || true

    - name: Patch Kernel Source
      run: |
        cd Code_Opensource/kernel
        # 补丁 1：修复 mm/memcg_reclaim.c 中的格式字符串类型不匹配
        sed -i 's/%lu/%llu/g' mm/memcg_reclaim.c
        # 补丁 2：移除 get_area_anon_reclaim_threshold_value 函数的强制内联属性
        sed -i 's/static inline unsigned long get_area_anon_reclaim_threshold_value/static unsigned long get_area_anon_reclaim_threshold_value/' mm/memcg_reclaim.c
        # 补丁 3：在全局 Makefile 中移除 -Werror 标志，防止警告中断编译
        sed -i 's/-Werror//g' Makefile
        # 补丁 4：修复新版 GCC 不识别旧版 -implicit-function-declaration 参数的问题
        sed -i 's/-Werror-implicit-function-declaration/-Werror=implicit-function-declaration/g' Makefile

    - name: Build Kernel
      run: |
        cd Code_Opensource/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make merge_full_k6833v1_64_defconfig
        
        # 【核心修复】在 .config 文件中禁用 STRONG 保护，改用 NONE
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
        sed -i 's/# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' .config
        
        make -j$(nproc) Image.gz

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        cd anykernel
        cp ../Code_Opensource/kernel/arch/arm64/boot/Image.gz .
        sed -i 's/device.name1=.*/device.name1=* /' anykernel.sh
        zip -r9 ../Honor-X20-SE-Kernel.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SukiSU-AnyKernel3
        path: Honor-X20-SE-Kernel.zip
