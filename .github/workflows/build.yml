name: Build Kernel
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - uses: actions/checkout@v4
    - name: Install Tools
      run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git curl bc bison build-essential flex libssl-dev libelf-dev zip unzip python3 cpio wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - name: SukiSU & Patch
      run: |
        cd Code_Opensource/kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || true
        find . -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <huawei_ts_kit|#include "huawei_ts_kit|g' || true
        find . -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <helio-dvfsrc|#include "helio-dvfsrc|g' || true
        find . -name "*.c" -o -name "*.h" | xargs sed -i 's|#include <clk-mux.h>|#include "clk-mux.h"|g' || true
        find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
        echo "" > drivers/devkit/tpkit/3_0/Makefile || true
        touch drivers/devkit/tpkit/3_0/built-in.o || true
    - name: Build
      run: |
        cd Code_Opensource/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error -Wno-format -Wno-return-type"
        make merge_full_k6833v1_64_defconfig
        # 必须把这几行加回来，关闭冲突的安全保护！
        sed -i 's/^CONFIG_HW_ROOT_SCAN=y/# CONFIG_HW_ROOT_SCAN is not set/' .config || true
        sed -i 's/^CONFIG_HUAWEI_EIMA=y/# CONFIG_HUAWEI_EIMA is not set/' .config || true
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config || true
        sed -i 's/# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' .config || true
        make drivers/huawei_platform/
        make -j$(nproc) Image.gz
    - name: Package
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        cd anykernel
        cp ../Code_Opensource/kernel/arch/arm64/boot/Image.gz .
        sed -i 's/device.name1=.*/device.name1=* /' anykernel.sh
        zip -r9 ../Honor-X20-SE-Kernel.zip *
    - uses: actions/upload-artifact@v4
      with:
        name: Kernel-SukiSU-AnyKernel3
        path: Honor-X20-SE-Kernel.zip
