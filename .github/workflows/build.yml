name: Build Honor X20 SE Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies and Toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y git curl bc bison build-essential flex libssl-dev libelf-dev zip unzip python3 cpio wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Integrate SukiSU
      run: |
        cd Code_Opensource/kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || true

    - name: Patch Kernel Source
      run: |
        cd Code_Opensource/kernel
        sed -i 's/recent refault: %lu/recent refault: %llu/' mm/memcg_reclaim.c || true
        sed -i 's/inline//g' mm/memcg_policy_internal.h || true
        sed -i 's/extern inline bool should_continue_reclaim/extern bool should_continue_reclaim/' mm/internal.h || true
        sed -i 's/static inline bool should_continue_reclaim/bool should_continue_reclaim/' mm/vmscan.c || true
        sed -i 's/inline void ksm_flock/void ksm_flock/' include/linux/keyslot-manager.h || true
        sed -i 's|#include <slowpath_count.h>|#include "slowpath_count.h"|' mm/slowpath_count.c || true
        sed -i 's|#include <clk-mux.h>|#include "clk-mux.h"|' drivers/clk/mediatek/clkdbg-mt6833.c || true
        sed -i 's|#include <dt_idle_states.h>|#include "dt_idle_states.h"|' drivers/cpuidle/cpuidle-mediatek.c || true
        sed -i 's/-Werror//g' Makefile || true
        sed -i 's/-Werror//g' scripts/Makefile.extrawarn || true
        find . -name "Makefile" -exec sed -i 's/-implicit-function-declaration//g' {} + || true
        find . -name "Makefile" -exec sed -i 's/-Werror-implicit-function-declaration//g' {} + || true
        find . -name "huawei_ts_kit_fsnod.c" -exec sed -i 's|#include <huawei_ts_kit.h>|#include "huawei_ts_kit.h"|' {} + || true
        find . -name "lcd_kit_adapt.c" -exec sed -i 's|#include "lcd_kit_adapt.h"|// #include "lcd_kit_adapt.h"|' {} + || true
        find . -name "lcd_kit_common.c" -exec sed -i '1i #include "lcd_kit_utils.h"' {} + || true

    - name: Build Kernel
      run: |
        cd Code_Opensource/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make merge_full_k6833v1_64_defconfig
        sed -i 's/^CONFIG_HW_ROOT_SCAN=y/# CONFIG_HW_ROOT_SCAN is not set/' .config || true
        sed -i 's/^CONFIG_HUAWEI_EIMA=y/# CONFIG_HUAWEI_EIMA is not set/' .config || true
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config || true
        sed -i 's/# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' .config || true
        export KCFLAGS="-Wno-error"
        make -j$(nproc) Image.gz

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        cd anykernel
        cp ../Code_Opensource/kernel/arch/arm64/boot/Image.gz .
        sed -i 's/device.name1=.*/device.name1=* /' anykernel.sh
        zip -r9 ../Honor-X20-SE-Kernel.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SukiSU-AnyKernel3
        path: Honor-X20-SE-Kernel.zip
