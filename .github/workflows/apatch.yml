name: Build Honor X20 SE Kernel (For APatch)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies and Toolchain
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y git curl bc bison build-essential flex libssl-dev libelf-dev zip unzip python3 cpio wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Patch Kernel Source
      run: |
        cd Code_Opensource/kernel
        
        # 1. 核心修复：彻底干掉旧版不支持的参数
        grep -rl -- "-implicit-function-declaration" . | xargs sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' || true
        grep -rl -- "-Werror-implicit-function-declaration" . | xargs sed -i 's/-Werror-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' || true
        
        # 2. 清理所有 Makefile 和 Kbuild 里的 -Werror
        find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
        find . -name "Kbuild" -exec sed -i 's/-Werror//g' {} + || true
        
        # 3. 内存与锁修复
        sed -i 's/recent refault: %lu/recent refault: %llu/' mm/memcg_reclaim.c || true
        sed -i 's/inline//g' mm/memcg_policy_internal.h || true
        sed -i 's/extern inline bool should_continue_reclaim/extern bool should_continue_reclaim/' mm/internal.h || true
        sed -i 's/static inline bool should_continue_reclaim/bool should_continue_reclaim/' mm/vmscan.c || true
        sed -i 's/inline void ksm_flock/void ksm_flock/' include/linux/keyslot-manager.h || true
        sed -i 's|#include <slowpath_count.h>|#include "slowpath_count.h"|' mm/slowpath_count.c || true
        sed -i 's|#include <clk-mux.h>|#include "clk-mux.h"|' drivers/clk/mediatek/clkdbg-mt6833.c || true
        sed -i 's|#include <dt_idle_states.h>|#include "dt_idle_states.h"|' drivers/cpuidle/cpuidle-mediatek.c || true
        sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/' include/linux/blk-crypto.h || true
        
        # 4. 显示与触控模块修复 (LCD/TP)
        find . -name "*.h" -exec sed -i 's|#include "hisi_fb.h"|// #include "hisi_fb.h"|g' {} + || true
        find . -name "*.c" -exec sed -i 's|#include "hisi_fb.h"|// #include "hisi_fb.h"|g' {} + || true
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <helio-dvfsrc-qos.h>|#include "helio-dvfsrc-qos.h"|g' {} + || true
        find . -name "*.c" -exec sed -i 's|#include <helio-dvfsrc-mt6833.h>|#include "helio-dvfsrc-mt6833.h"|g' {} + || true
        echo 'ccflags-y += -I$(srctree)/drivers/devfreq/helio-dvfsrc-v3/' >> drivers/devfreq/helio-dvfsrc-v3/Makefile || true
        find . -name "*.h" -exec sed -i 's|#include "lcd_kit_adapt.h"|// #include "lcd_kit_adapt.h"|g' {} + || true
        find . -name "*.c" -exec sed -i 's|#include "lcd_kit_adapt.h"|// #include "lcd_kit_adapt.h"|g' {} + || true
        find . -name "lcd_kit_utils.h" -exec sed -i 's|#include <linux/hisi/|// #include <linux/hisi/|g' {} + || true
        find . -name "lcd_kit_utils.h" -exec sed -i '1i #define LCD_PANEL_VERSION_SIZE 16' {} + || true
        find . -name "lcd_kit_utils.h" -exec sed -i '1i typedef int demura_set_info_t;' {} + || true
        find . -name "lcd_kit_adapt.c" -exec sed -i 's|"cmd len is %d\\n"|"cmd len is %zu\\n"|g' {} + || true
        echo 'ccflags-y += -Wno-format' >> drivers/devkit/lcdkit/lcdkit3.0/kernel/mtk/adapt/Makefile || true
        find . -name "lcd_kit_adapt.c" -exec sed -i '1i #define DTYPE_DSC_LWRITE 0x39\n#define MTK_READ_MAX_LEN 256' {} + || true
        find . -name "lcd_kit_adapt.c" -exec sed -i 's|case DTYPE_DSC_LWRITE:|// case DTYPE_DSC_LWRITE:|g' {} + || true
        
        find . -name "huawei_ts_kit_fsnode.c" -exec sed -i 's|.*#include.*huawei_ts_kit.h.*|// &|g' {} + || true
        find . -name "*.h" -exec sed -i 's|.*#include.*huawei_ts_kit.h.*|// &|g' {} + || true
        find . -name "*.h" -exec sed -i 's|.*#include.*bias_bl_utils.h.*|// &|g' {} + || true
        find . -name "*.c" -exec sed -i 's|.*#include.*bias_bl_utils.h.*|// &|g' {} + || true
        sed -i '/huawei_ts_kit.h/d' drivers/devkit/tpkit/3_0/huawei_ts_kit_fsnode.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/devkit/tpkit/3_0/' >> drivers/devkit/tpkit/3_0/Makefile || true
        find . -name "huawei_ts_kit_fsnode.c" -exec sed -i '1i #define TS_WORK_IN_SLEEP 0\n#define SUSPEND_NEED_CAP_TEST 0' {} + || true
        find drivers/devkit/tpkit/ -name "*.c" -exec sed -i 's|#include <huawei_ts_kit|#include "huawei_ts_kit|g' {} + || true
        find drivers/devkit/tpkit/ -name "*.h" -exec sed -i 's|#include <huawei_ts_kit|#include "huawei_ts_kit|g' {} + || true
        find . -name "ktd3136.c" -exec sed -i 's|errno = %ld|errno = %d|g' {} + || true
        echo "" > drivers/devkit/tpkit/3_0/Makefile || true
        touch drivers/devkit/tpkit/3_0/built-in.o || true

        # 5. 传感器与底层拦截
        find . -name "motion_channel.c" -exec sed -i 's|#include <motion.h>|#include "motion.h"|g' {} + || true
        echo 'ccflags-y += -I$(srctree)/drivers/huawei_platform/sensor2_0/' >> drivers/huawei_platform/sensor2_0/Makefile || true
        find . -path "*/hwzerohung/*.c" -exec sed -i 's|#include <zrhung_common.h>|#include "zrhung_common.h"|g' {} + || true
        echo 'ccflags-y += -I$(srctree)/drivers/hwzerohung/' >> drivers/hwzerohung/Makefile || true

        # 6. 显示 Trace 与 DRM 修复
        touch drivers/gpu/drm/mediatek/mtk_layer_layout_trace.h || true
        find . -path "*/mediatek/*.c" -exec sed -i 's|#include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|// #include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|g' {} + || true
        find drivers/gpu/drm/mediatek/ -name "*.c" -exec sed -i 's|#define CREATE_TRACE_POINTS|// #define CREATE_TRACE_POINTS|g' {} + || true
        find drivers/gpu/drm/mediatek/ -name "*.c" -exec sed -i 's|#include <mtk_drm_drv.h>|#include "mtk_drm_drv.h"|g' {} + || true

        # 7. IOMMU 与 电源管理
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6853/include/mach/ -I$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6853/include/ -I$(srctree)/drivers/misc/mediatek/include/mt-plat/' >> drivers/iommu/Makefile || true
        find . -name "mtk_iommu_ext.h" -exec cp {} drivers/iommu/ \; || true
        find . -name "mtk_iommu_ext.h" -exec cp {} drivers/misc/mediatek/include/mt-plat/mt6853/include/mach/ \; || true
        find . -name "mtk_iommu_ext.h" -exec cp {} drivers/misc/mediatek/include/mt-plat/mt6853/include/ \; || true
        find . -name "mtk_iommu_ext.h" -exec cp {} drivers/misc/mediatek/include/mt-plat/ \; || true
        echo 'EXTRA_CFLAGS += -I$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6853/include/mach/' >> drivers/iommu/Makefile || true

        echo 'ccflags-y += -I$(srctree)/drivers/mmc/host/mediatek/ComboA' >> drivers/mmc/host/mediatek/ComboA/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/cache-auditor' >> drivers/misc/mediatek/cache-auditor/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/slbc' >> drivers/misc/mediatek/base/power/slbc/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853' >> drivers/misc/mediatek/base/power/ppm_v3/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/inc' >> drivers/misc/mediatek/base/power/ppm_v3/Makefile || true
        find . -name "mtk_ppm_platform.h" -exec cp {} drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853/ \; || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853/' >> drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853/Makefile || true
        echo 'EXTRA_CFLAGS += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853/' >> drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6853/Makefile || true

        find . -name "mtk_swpm_platform.h" -exec cp {} drivers/misc/mediatek/base/power/include/swpm_v1/ \; || true
        find . -name "mtk_swpm_platform.h" -exec cp {} drivers/misc/mediatek/base/power/swpm_v1/mt6833/ \; || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/include/swpm_v1/' >> drivers/misc/mediatek/base/power/swpm_v1/Makefile || true
        find . -name "mtk_swpm_platform.c" -exec sed -i 's/VDD12_DRAM/VIO18_DRAM/g' {} + || true
        find . -name "mtk_swpm_platform.c" -exec sed -i 's/VDD18_DRAM/VIO18_DRAM/g' {} + || true
        sed -i '1214s/case VIO18_DRAM:/\/\/ case VIO18_DRAM:/' drivers/misc/mediatek/base/power/swpm_v1/mt6833/mtk_swpm_platform.c || true
        find . -name "mtk_swpm_platform.c" -exec sed -i 's/VIO18_DRAM/VDD18_DRAM/g' {} + || true
        find . -name "mtk_swpm_platform.c" -exec sed -i 's/case VDD18_DRAM:/\/\/ case VDD18_DRAM:/g' {} + || true

        # 8. 相机与充电模块修复
        find . -name "isp_common.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "isp_common.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/ \; || true
        find . -name "gpiolib.h" -exec cp {} drivers/pinctrl/mediatek/ \; || true
        find . -name "mtk_charger_intf.h" -exec cp {} drivers/power/supply/mediatek/charger/ \; || true
        find . -name "mtk_gauge_class.h" -exec cp {} drivers/power/supply/mediatek/battery/ \; || true
        find . -name "mtk_gauge_class.h" -exec cp {} drivers/power/supply/mediatek/charger/ \; || true
        find . -name "camera_isp.c" -exec sed -i 's|#include "../../../common/isp_common.h"|#include "isp_common.h"|g' {} + || true
        find . -name "pinctrl-mtk-common-v2_debug.c" -exec sed -i 's|#include "../../../gpio/gpiolib.h"|#include "gpiolib.h"|g' {} + || true
        echo 'ccflags-y += -I$(srctree)/drivers/power/supply/mediatek/battery/ -I$(srctree)/drivers/power/supply/mediatek/charger/' >> drivers/power/supply/mediatek/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/power/supply/mediatek/battery/' >> drivers/power/supply/mediatek/battery/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/power/supply/mediatek/charger/' >> drivers/power/supply/mediatek/charger/Makefile || true

        # 9. 相机底层深入修复 (ION, CCU, QOS)
        find . -type d -name "ccu_ext_interface" -exec cp -r {} drivers/misc/mediatek/ccu/src/mt6833/ \; || true
        find . -name "camera_isp.c" -exec sed -i 's|../../../common/isp_common.h|isp_common.h|g' {} + || true
        find . -name "camera_isp.c" -exec sed -i 's|.*#include.*isp_common\.h.*|#include "isp_common.h"|g' {} + || true
        find . -name "pinctrl-mtk-common-v2_debug.c" -exec sed -i 's|.*#include.*gpiolib\.h.*|#include <linux/gpio/gpiolib.h>|g' {} + || true
        find . -name "ccu_hw.c" -exec sed -i 's|.*#include.*ccu_ext_interface\.h.*|#include "ccu_ext_interface.h"|g' {} + || true
        find . -name "ccu_ext_interface.h" -exec cp {} drivers/misc/mediatek/ccu/src/mt6833/ \; || true
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|"ccu_ext_interface/ccu_ext_interface.h"|"ccu_ext_interface.h"|g' {} + || true
        find . -name "ccu_ext_interface.h" -exec cp {} drivers/misc/mediatek/ccu/src/mt6833/ccu_ext_interface/ \; || true
        find . -name "pinctrl-mtk-common-v2_debug.c" -exec sed -i 's|#include <linux/gpio/gpiolib.h>|#include "gpiolib.h"|g' {} + || true
        find . -name "cam_qos.c" -exec sed -i 's|#include "inc/camera_isp.h"|#include "camera_isp.h"|g' {} + || true
        find . -name "camera_isp.c" -exec sed -i 's|#include "./inc/mt_events_camsys.h"|#include "mt_events_camsys.h"|g' {} + || true
        find . -name "camera_isp.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "mt_events_camsys.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        if [ -d "drivers/misc/mediatek/cameraisp/src/mt6853/inc" ]; then cp -r drivers/misc/mediatek/cameraisp/src/mt6853/inc/* drivers/misc/mediatek/cameraisp/src/mt6853/ || true; fi
        find . -name "ccu_ext_interface.h" -exec sed -i 's|#include "ccu_ext_interface/ccu_types.h"|#include "ccu_types.h"|g' {} + || true
        find . -name "ccu_types.h" -exec cp {} drivers/misc/mediatek/ccu/src/mt6833/ \; || true
        mkdir -p drivers/misc/mediatek/cameraisp/src/mt6853/inc || true
        find . -name "mt_events_camsys.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/inc/ \; || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/cameraisp/src/mt6853/inc/' >> drivers/misc/mediatek/cameraisp/src/mt6853/Makefile || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "Makefile" -exec sed -i 's/cam_qos.occflags-y//g' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "Makefile" -exec sed -i 's/\.occflags-y//g' {} + || true
        echo -e "\nccflags-y += -I\$(srctree)/drivers/misc/mediatek/cameraisp/src/mt6853/inc/" >> drivers/misc/mediatek/cameraisp/src/mt6853/Makefile || true
        find drivers/misc/mediatek/cameraisp/ -name "*.c" -exec sed -i 's|#include <trace/define_trace.h>|// #include <trace/define_trace.h>|g' {} + || true
        find drivers/misc/mediatek/cameraisp/ -name "*.h" -exec sed -i 's|#include <trace/define_trace.h>|// #include <trace/define_trace.h>|g' {} + || true
        find drivers/misc/mediatek/cameraisp/ -name "*.c" -exec sed -i 's|#include "./inc/mt_events_camsys.h"|// #include "./inc/mt_events_camsys.h"|g' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "Makefile" -exec sed -i '/ccflags-y/d' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/inc -name "*.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "ccu_types.h" -exec cp {} drivers/misc/mediatek/ccu/src/mt6833/ \; || true
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|"ccu_ext_interface/ccu_types.h"|"ccu_types.h"|g' {} + || true
        find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <ccu_ext_interface/ccu_types.h>|#include "ccu_types.h"|g' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "Makefile" -exec sed -i 's/^        /\t/g' {} + || true
        sed -i '/ccflags-y/d' drivers/misc/mediatek/cameraisp/src/mt6853/Makefile || true
        printf "\nccflags-y += -I\$(srctree)/drivers/misc/mediatek/cameraisp/src/mt6853/inc/\n" >> drivers/misc/mediatek/cameraisp/src/mt6853/Makefile || true
        rm -f drivers/misc/mediatek/cameraisp/src/mt6853/Makefile || true
        printf "ccflags-y += -I\$(srctree)/drivers/misc/mediatek/cameraisp/src/mt6853/inc/\n" > drivers/misc/mediatek/cameraisp/src/mt6853/Makefile
        printf "obj-y += \$(patsubst %%.c,%%.o,\$(notdir \$(wildcard \$(srctree)/\$(src)/*.c)))\n" >> drivers/misc/mediatek/cameraisp/src/mt6853/Makefile
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "*.c" -exec sed -i 's|#include <clk-mt6833-pg.h>|#include "clk-mt6833-pg.h"|g' {} + || true
        find . -name "clk-mt6833-pg.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "*.c" -exec sed -i 's|#include <smi_public.h>|#include "smi_public.h"|g' {} + || true
        find . -name "smi_public.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "cam_qos.h" -exec sed -i 's|#include "inc/camera_isp.h"|#include "camera_isp.h"|g' {} + || true
        find . -name "camera_isp.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/inc/ \; || true
        mkdir -p vendor/mediatek/kernel_modules/connectivity/common || true
        sed -i 's|\$(error .* not exists. Stop.)|# &|g' drivers/misc/mediatek/connectivity/Makefile || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "*.c" -exec sed -i 's|#include <archcounter_timesync.h>|#include "archcounter_timesync.h"|g' {} + || true
        find . -name "archcounter_timesync.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "ion_drv.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -name "ion.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "ion_drv.h" -exec sed -i 's|#include <ion.h>|#include "ion.h"|g' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "camera_isp.c" -exec sed -i 's/ion_sec_heap_create/ion_client_create/g' {} + || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "camera_isp.c" -exec sed -i 's/ion_sec_heap_destroy/ion_client_destroy/g' {} + || true
        find . -path "*/include/linux/ion.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find . -path "*/drivers/staging/android/ion/ion.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "ion_drv.h" -exec sed -i 's|#include "../uapi/ion.h"|#include "ion.h"|g' {} + || true
        mkdir -p drivers/misc/mediatek/cameraisp/src/uapi || true
        find . -name "ion.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/uapi/ \; || true
        find . -name "mmdvfs_pmqos.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "cam_qos.c" -exec sed -i 's|#include <mmdvfs_pmqos.h>|#include "mmdvfs_pmqos.h"|g' {} + || true
        find . -name "mt6853-larb-port.h" -exec cp {} drivers/misc/mediatek/cameraisp/src/mt6853/ \; || true
        find drivers/misc/mediatek/cameraisp/src/mt6853/ -name "cam_qos.c" -exec sed -i 's|#include <mt6853-larb-port.h>|#include "mt6853-larb-port.h"|g' {} + || true
        find drivers/misc/mediatek/connectivity/ -name "Makefile" -exec sed -i 's/$(error .*not existed. Stop.)/# &/' {} + || true

        # 暴力绝杀：只要 connectivity 的 Makefile 里带有 error 或 Stop 的行，统统删掉！
        find drivers/misc/mediatek/connectivity/ -name "Makefile" -exec sed -i '/\$(error/d' {} + || true
        find drivers/misc/mediatek/connectivity/ -name "Makefile" -exec sed -i '/Stop\./d' {} + || true

        # 2. 修复 UFS 驱动找不到 ufs.h 的问题
        find . -name "ufs.h" -exec cp {} drivers/scsi/ufs/mediatek/mt6853/ \; || true
        find drivers/scsi/ufs/mediatek/mt6853/ -name "*.h" -exec sed -i 's|#include <ufs.h>|#include "ufs.h"|g' {} + || true

        # 69. 物理搬运：解决蓝牙模块找不到 wmt_exp.h 的问题
        find . -name "wmt_exp.h" -exec cp {} drivers/misc/mediatek/connectivity/bt/ \; || true
        # 如果是被强行包含的，把尖括号改成双引号（或者直接注释）
        find drivers/misc/mediatek/connectivity/bt/ -name "*.h" -exec sed -i 's|#include "wmt_exp.h"|#include "wmt_exp.h"|g' {} + || true

        # 彻底屏蔽找不到源码的 dbgtop (调试) 模块
        echo "obj-y := " > drivers/misc/mediatek/dbgtop/Makefile || true
        
        # 彻底屏蔽缺少闭源 osal.h 的蓝牙模块 (bt)
        echo "obj-y := " > drivers/misc/mediatek/connectivity/bt/Makefile || true

        # 精准救援：解决 FM 收音机找不到 osal_typedef.h 的问题
        # 1. 全盘搜出这个头文件，复制到报错的当前目录
        find . -name "osal_typedef.h" -exec cp {} drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ \; || true
        
        # 2. 顺便把包含它的那行代码的尖括号/双引号确认一下（确保优先本地查找）
        find drivers/misc/mediatek/connectivity/fmradio/ -name "*.c" -exec sed -i 's|#include "osal_typedef.h"|#include "osal_typedef.h"|g' {} + || true

        # 把 wmt_drv 和 common 底下所有的头文件，全部打包搬到 FM 模块的 pub 目录下！
        find drivers/misc/mediatek/connectivity/wmt_drv/ -name "*.h" -exec cp {} drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ \; || true
        find drivers/misc/mediatek/connectivity/common/ -name "*.h" -exec cp {} drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ \; || true

        # 1. 精确制导：直接把真实位置的 ring.h 复制过去，覆盖掉可能找错的同名文件
        cp drivers/misc/mediatek/connectivity/wmt_drv/debug_utility/ring.h drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ || true
        # 2. 把 osal.h 里那个恶心的相对路径改成直接双引号引用
        find drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ -name "osal.h" -exec sed -i 's|#include "../../debug_utility/ring.h"|#include "ring.h"|g' {} + || true

        # 修复 mtk_wcn_cmb_hw.h 用尖括号引用 osal_typedef.h 找不到的问题
        # 1. 把当前目录（pub）下所有 .c 和 .h 文件里的 <osal_typedef.h> 全改成 "osal_typedef.h"
        find drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's|#include <osal_typedef.h>|#include "osal_typedef.h"|g' {} + || true

        # 2. 双重保险：直接把当前 pub 目录加到 FM 收音机的 Makefile 搜索路径里
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/' >> drivers/misc/mediatek/connectivity/fmradio/Makefile || true

        # 修复 osal.h 的 incomplete type 报错（强制让它先包含 ring.h）
        find drivers/misc/mediatek/connectivity/fmradio/chips/mt6631/pub/ -name "osal.h" -exec sed -i '1i #include "ring.h"' {} + || true

        # ==========================================
        # 精确制导救援（根据 WSL 本地搜索结果）
        # ==========================================
        
        # 1. 救援 GPS 模块 (缺 osal_typedef.h)
        cp drivers/misc/mediatek/connectivity/wmt_drv/common_main/linux/include/osal_typedef.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        find drivers/misc/mediatek/connectivity/gps_drv/ -type f -exec sed -i 's|#include "osal_typedef.h"|#include "osal_typedef.h"|g' {} + || true

        # 2. 救援 debug_latch 模块 (缺 cache_parity.h)
        # 它自己就在自己目录下，但用了 < >，直接改掉并加路径
        sed -i 's|#include <cache_parity.h>|#include "cache_parity.h"|g' drivers/misc/mediatek/debug_latch/cache_parity/cache_parity.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/debug_latch/cache_parity/' >> drivers/misc/mediatek/debug_latch/cache_parity/Makefile || true

        # 3. 救援 UFS 存储模块 (缺 ufshcd.h)
        # UFS 是手机硬盘，非常重要！把它复制到 mt6853 目录下
        cp drivers/scsi/ufs/ufshcd.h drivers/scsi/ufs/mediatek/mt6853/ || true
        find drivers/scsi/ufs/mediatek/mt6853/ -type f -exec sed -i 's|#include <ufshcd.h>|#include "ufshcd.h"|g' {} + || true

        # ==========================================
        # 绝对路径精确救援（根据 WSL 搜索结果）
        # ==========================================
        
        # 1. 救援 GPS (缺 stp_exp.h)
        cp drivers/misc/mediatek/connectivity/wmt_drv/common_main/include/stp_exp.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        sed -i 's|#include "stp_exp.h"|#include "stp_exp.h"|g' drivers/misc/mediatek/connectivity/gps_drv/stp_chrdev_gps.c || true

        # 2. 救援 debug_latch (缺 plat_dbg_info.h)
        # 文件就在本地，把尖括号改双引号，并加搜索路径
        sed -i 's|#include <plat_dbg_info.h>|#include "plat_dbg_info.h"|g' drivers/misc/mediatek/debug_latch/plat_dbg_info/plat_dbg_info.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/debug_latch/plat_dbg_info/' >> drivers/misc/mediatek/debug_latch/plat_dbg_info/Makefile || true

        # 3. 救援 SPMI (缺 spmi_sw.h)
        # 文件就在本地，改引号并加路径
        sed -i 's|#include <spmi_sw.h>|#include "spmi_sw.h"|g' drivers/spmi/mtk-pmif.c drivers/spmi/mtk-dbg.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/spmi/' >> drivers/spmi/Makefile || true

        # 4. 终极抢救 UFS 存储 (缺 struct ufs_sb_private_info)
        # 将全局完整的 ufs.h 强行覆盖掉 mt6853 目录下那个残缺的 ufs.h
        cp drivers/scsi/ufs/ufs.h drivers/scsi/ufs/mediatek/mt6853/ufs.h || true
        find drivers/scsi/ufs/mediatek/mt6853/ -name "*.h" -exec sed -i 's|#include <ufs.h>|#include "ufs.h"|g' {} + || true

        # 彻底解决 GPS 模块的套娃依赖：把 wmt_drv 的 include 目录下所有 .h 全搬过去
        cp drivers/misc/mediatek/connectivity/wmt_drv/common_main/linux/include/*.h drivers/misc/mediatek/connectivity/gps_drv/ || true

        # 修复 osal.h 搬家后，原有的相对路径失效的问题
        # 1. 把 ring.h 也搬到 gps_drv 目录
        cp drivers/misc/mediatek/connectivity/wmt_drv/debug_utility/ring.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        # 2. 把 osal.h 里那个找不到的相对路径，改成直接双引号引用
        sed -i 's|#include "../../debug_utility/ring.h"|#include "ring.h"|g' drivers/misc/mediatek/connectivity/gps_drv/osal.h || true

        # ==========================================
        # 终极扫尾：GPS 套娃与 UFS 协议头文件
        # ==========================================
        
        # 1. GPS 模块：把 wmt_drv 里的 include 目录全搬过去，管饱
        cp drivers/misc/mediatek/connectivity/wmt_drv/common_main/include/*.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        sed -i 's|#include <wmt_exp.h>|#include "wmt_exp.h"|g' drivers/misc/mediatek/connectivity/gps_drv/stp_chrdev_gps.c || true

        # 2. UFS Trace 头文件：强制让 ufs 目录能在自己脚下找到头文件
        echo 'ccflags-y += -I$(srctree)/drivers/scsi/ufs/' >> drivers/scsi/ufs/Makefile || true
        
        # 3. UFS unipro.h：直接把它找出来塞给 mt6853 目录
        # （用绝对路径指向标准的 ufs 目录，防止找错）
        if [ -f drivers/scsi/ufs/unipro.h ]; then
            cp drivers/scsi/ufs/unipro.h drivers/scsi/ufs/mediatek/mt6853/ || true
        else
            find . -name "unipro.h" -exec cp {} drivers/scsi/ufs/mediatek/mt6853/ \; || true
        fi
        sed -i 's|#include <unipro.h>|#include "unipro.h"|g' drivers/scsi/ufs/mediatek/mt6853/ufs-mtk-platform.c || true

        # 1. 强制把 gps_drv 目录加入搜索路径，以后这个目录里的尖括号都能认了
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/gps_drv/' >> drivers/misc/mediatek/connectivity/gps_drv/Makefile || true

        # 2. 顺便把所有 gps_drv 目录下的尖括号引用改成双引号，双保险
        find drivers/misc/mediatek/connectivity/gps_drv/ -type f -exec sed -i 's|#include <osal_typedef.h>|#include "osal_typedef.h"|g' {} + || true

        # 终极救援 GPS：暴力搬运 wmt_drv 下的所有头文件，并加满搜索路径
        # 1. 把 wmt_drv 整个目录下所有的 .h 文件全搜出来，全塞给 gps_drv
        find drivers/misc/mediatek/connectivity/wmt_drv/ -name "*.h" -exec cp {} drivers/misc/mediatek/connectivity/gps_drv/ \; || true

        # 2. 强行把 wmt_drv 及其常见的 include 目录，全加到 gps_drv 的搜索路径里
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wmt_drv/' >> drivers/misc/mediatek/connectivity/gps_drv/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wmt_drv/common/include/' >> drivers/misc/mediatek/connectivity/gps_drv/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wmt_drv/common_main/linux/include/' >> drivers/misc/mediatek/connectivity/gps_drv/Makefile || true

        # 终极修复 gps 的 osal.h 找不到 ring.h 的问题
        # 1. 强制把 ring.h 复制过去
        cp drivers/misc/mediatek/connectivity/wmt_drv/debug_utility/ring.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        # 2. 暴力正则匹配：只要这行里有 ring.h，整行替换为 #include "ring.h"
        sed -i 's|#include .*ring\.h.*|#include "ring.h"|g' drivers/misc/mediatek/connectivity/gps_drv/osal.h || true

        # ==========================================
        # 绝对路径精确制导（彻底规避重名文件）
        # ==========================================
        
        # 1. 救援 GPS (缺 gps_lna_drv.h)
        cp drivers/misc/mediatek/connectivity/gps_drv/lna_ctrl/inc/gps_lna_drv.h drivers/misc/mediatek/connectivity/gps_drv/ || true
        sed -i 's|#include "gps_lna_drv.h"|#include "gps_lna_drv.h"|g' drivers/misc/mediatek/connectivity/gps_drv/stp_chrdev_gps.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/gps_drv/' >> drivers/misc/mediatek/connectivity/gps_drv/Makefile || true

        # 2. 救援 ION (缺 ion.h)
        # 必须指定为 drivers/staging/android/ion/ion.h，千万别拿错
        cp drivers/staging/android/ion/ion.h drivers/staging/android/ion/mtk/ || true
        sed -i 's|#include <ion.h>|#include "ion.h"|g' drivers/staging/android/ion/mtk/ion_drv.h || true
        echo 'ccflags-y += -I$(srctree)/drivers/staging/android/ion/mtk/' >> drivers/staging/android/ion/mtk/Makefile || true

        # 3. 救援 devmpu (缺 devmpu.h)
        # 就在同目录下，直接改尖括号
        sed -i 's|#include <devmpu.h>|#include "devmpu.h"|g' drivers/misc/mediatek/devmpu/devmpu.c || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/devmpu/' >> drivers/misc/mediatek/devmpu/Makefile || true

        # 救援 Wi-Fi 驱动找不到 wmt_exp.h
        # 1. 把 wmt_exp.h 强行复制到 Wi-Fi 报错的 include 目录下
        cp drivers/misc/mediatek/connectivity/wmt_drv/common_main/linux/include/wmt_exp.h drivers/misc/mediatek/connectivity/wlan_drv_gen4m/os/linux/include/ || true
        # 如果上面那个路径没有，试一下 common 目录下的
        cp drivers/misc/mediatek/connectivity/wmt_drv/common/include/wmt_exp.h drivers/misc/mediatek/connectivity/wlan_drv_gen4m/os/linux/include/ || true
        
        # 2. 把 wmt_drv 的路径加到 Wi-Fi 驱动的 Makefile 里
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wmt_drv/common_main/linux/include/' >> drivers/misc/mediatek/connectivity/wlan_drv_gen4m/os/linux/Makefile || true
        echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/connectivity/wmt_drv/common/include/' >> drivers/misc/mediatek/connectivity/wlan_drv_gen4m/os/linux/Makefile || true

    - name: Build Kernel
      run: |
        cd Code_Opensource/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make merge_full_k6833v1_64_defconfig
        
        # 1. 修改基础配置
        sed -i 's/^CONFIG_HW_ROOT_SCAN=y/# CONFIG_HW_ROOT_SCAN is not set/' .config || true
        sed -i 's/^CONFIG_HUAWEI_EIMA=y/# CONFIG_HUAWEI_EIMA is not set/' .config || true
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config || true
        sed -i 's/# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' .config || true
        
        # 2. 【APatch 核心】强制开启 KALLSYMS
        sed -i 's/^# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' .config || true
        sed -i 's/^# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' .config || true
        
        # 3. 强制刷新配置
        make olddefconfig
        
        # 4. 闭麦参数
        export KCFLAGS="-Wno-error -Wno-format -Wno-format-security -Wno-format-overflow -Wno-format-truncation -Wno-return-type -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-sizeof-pointer-memaccess"
        
        # 5. 单模块排查 + 全量编译
        make drivers/huawei_platform/
        make -j$(nproc) Image.gz

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        cd anykernel
        cp ../Code_Opensource/kernel/arch/arm64/boot/Image.gz .
        sed -i 's/device.name1=.*/device.name1=* /' anykernel.sh
        zip -r9 ../Honor-X20-SE-APatch.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-APatch-AnyKernel3
        path: Honor-X20-SE-APatch.zip
